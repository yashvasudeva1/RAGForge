[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragforge"
version = "0.1.0"
description = "A drag-and-drop visual builder for RAG pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Yash Vasudeva" }]
keywords = ["rag", "llm", "retrieval-augmented-generation", "pipeline", "visual-builder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "pyyaml>=6.0",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",

    # LLM integrations (install extras as needed)
    "openai>=1.30",
    "anthropic>=0.28",
    "google-genai>=1.0",
    "groq>=0.9",

    # Embeddings
    "sentence-transformers>=3.0",
    "tiktoken>=0.7",

    # Document loading
    "pypdf>=4.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.9",

    # Chunking
    "nltk>=3.8",

    # Vector stores (at least one required)
    "chromadb>=0.5",

    # Retrieval
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Full set of document loaders
loaders = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "lxml>=5.0",
    "markdown>=3.6",
    "unstructured>=0.14",
]

# Additional vector store backends
vectorstores = [
    "qdrant-client>=1.9",
    "faiss-cpu>=1.8",
    "pinecone>=4.0",
    "weaviate-client>=4.6",
    "pymilvus>=2.4",
    "lancedb>=0.8",
]

# Additional embedding providers
embeddings = [
    "cohere>=5.5",
    "langchain-voyageai>=0.1",
]

# Additional LLM providers
llm = [
    "mistralai>=1.0",
    "ollama>=0.2",
    "together>=1.2",
]

# Reranking
reranking = [
    "cohere>=5.5",
]

# Evaluation
eval = [
    "ragas>=0.1",
    "deepeval>=0.21",
]

# Observability
observability = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

# OCR support
ocr = [
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "easyocr>=1.7",
]

# Development
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "rich>=13.0",
]

# Everything
all = [
    "ragforge[loaders,vectorstores,embeddings,llm,reranking,eval,observability,ocr,dev]",
]

[project.scripts]
ragforge = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ------------------------------------------------------------------ #
# Ruff (linter + formatter)
# ------------------------------------------------------------------ #
[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "ANN401",  # dynamically typed expressions (Any) are disallowed
    "B008",    # do not perform function calls in default arguments (Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ------------------------------------------------------------------ #
# Mypy
# ------------------------------------------------------------------ #
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ------------------------------------------------------------------ #
# Pytest
# ------------------------------------------------------------------ #
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
